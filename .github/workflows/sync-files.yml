name: Sync Configuration File

on:
  push:
    branches:
      - main
    paths:
      - 'default'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy A to B
        run: |
          # 💡 ディレクトリがなければ作成する（先頭の / は不要）
          mkdir -p etc/default
          
          # 💡 リポジトリ内の相対パスとしてコピー
          cp "default" "etc/default/tar109a"
          cp "default" "etc/default/tar1090_972"

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # 💡 先にファイルをGitのステージング（登録）に追加する
          git add "etc/default/tar109a" "etc/default/tar1090_972"
          
          # 💡 登録された差分がある場合のみコミットしてプッシュする
          git diff --staged --quiet || (
            git commit -m "chore: auto-sync from A to B"
            git push
          )
