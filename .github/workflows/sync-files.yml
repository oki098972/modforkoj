name: Sync Configuration File

on:
  push:
    branches:
      - main
    paths:
      - 'default'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy A to B
        run: |
          # 💡 ディレクトリがなければ作成する（先頭の / は不要）
          mkdir -p etc/default
          
          # 💡 リポジトリ内の相対パスとしてコピー
          cp "default" "etc/default/tar109a"
          cp "default" "etc/default/tar1090_972"

      - name: Commit and Push changes
        run: |
          # 💡 メールアドレスを一般的なボットのアドレスに修正
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 💡 git add も先頭の / を外す
          git diff --quiet && git diff --staged --quiet || (
            git add "etc/default/tar109a"
            git add "etc/default/tar1090_972"
            git commit -m "chore: auto-sync from A to B"
            git push
          )
